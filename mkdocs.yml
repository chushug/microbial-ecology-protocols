site_name: Microbial Ecology Lab Protocols
site_url: https://chushug.github.io/microbial-ecology-protocols/
copyright: '&copy; 2026 <a href="https://github.com/chushug/microbial-ecology-protocols" target="_blank">Chushu Gao</a>'

theme:
  name: material
  palette:
    primary: blue
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js
  - javascripts/bench-record.js

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Bench Protocols:
    - Soil DNA Extraction (96-well): manuals/dna-extraction-96-powersoil.md
    - Soil DNA Extraction (PowerLyzer): manuals/dna-extraction-powerlyzer-powersoil.md
    - Soil RNA Extraction: manuals/rna-extraction-powersoil.md
    - Soil RNA DNase & cDNA Synthesis: manuals/soil-rna-dnase-cdna.md
    - Agarose Gel Electrophoresis: manuals/gel-electrophoresis.md
    - PCR - Regular: manuals/regular-pcr.md
    - PCR - qPCR Reaction Setup: manuals/qpcr-reaction-setup.md
    - Ammonium and Nitrate Assay: manuals/ammonium-nitrate-assay.md
    - Soil WHC Gravity Drainage: manuals/soil-whc-gravity-drainage.md
    - Nitrification Incubation Study: manuals/nitrification-incubation-study.md
  - Workflow & Interpretation:
    - Gene Cloning & qPCR Standards: manuals/gene-cloning-qpcr-standards.md
    - PCR - Principles and Troubleshooting: manuals/pcr-principles-troubleshooting.md
    - Nucleic Acid QC - NanoDrop and Qubit: manuals/nucleic-acid-qc-nanodrop-qubit.md
    - Nitrification Incubation - Principles and Interpretation: manuals/nitrification-incubation-interpretation.md
