url: https://chushug.github.io/microbial-ecology-protocols/
destination: site

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  bslib:
    primary: "#1f6f8b"
    border-radius: 0.35rem
  includes:
    in_header: |
      <script>
      (function () {
        var prefix = /\/articles\//.test(window.location.pathname) ? "../" : "";
        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = prefix + "lab-protocols.css";
        document.head.appendChild(css);

        var capture = document.createElement("script");
        capture.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
        capture.defer = true;
        document.head.appendChild(capture);

        var bench = document.createElement("script");
        bench.src = prefix + "bench-record.js";
        bench.defer = true;
        document.head.appendChild(bench);
      })();
      </script>

navbar:
  structure:
    left: [home, articles]
    right: [search, github]
  components:
    articles:
      text: Bench Manuals
      menu:
      - text: Soil DNA Extraction (96-well)
        href: articles/dna-extraction-96-powersoil.html
      - text: Soil RNA Extraction
        href: articles/rna-extraction-powersoil.html
      - text: Soil RNA DNase & cDNA Synthesis
        href: articles/soil-rna-dnase-cdna.html
      - text: Agarose Gel Electrophoresis
        href: articles/gel-electrophoresis.html
      - text: Regular PCR
        href: articles/regular-pcr.html
      - text: Ammonium and Nitrate Assay
        href: articles/ammonium-nitrate-assay.html
      - text: Gene Cloning & qPCR Standards
        href: articles/gene-cloning-qpcr-standards.html
    github:
      icon: fa-github
      href: https://github.com/chushug/microbial-ecology-protocols
      aria-label: GitHub

articles:
- title: Bench Manuals
  navbar: Bench Manuals
  contents:
  - dna-extraction-96-powersoil
  - rna-extraction-powersoil
  - soil-rna-dnase-cdna
  - gel-electrophoresis
  - regular-pcr
  - ammonium-nitrate-assay
  - gene-cloning-qpcr-standards
